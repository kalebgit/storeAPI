services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  config-service:
    image: ghcr.io/kalebgit/storeapi-config-service:latest
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  registry-service:
    image: ghcr.io/kalebgit/storeapi-registry-service:latest
    depends_on:
      config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  auth-service:
    image: ghcr.io/kalebgit/storeapi-auth-service:latest
    depends_on:
      config-service:
        condition: service_healthy
      registry-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:8761/eureka/
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  customer-service:
    image: ghcr.io/kalebgit/storeapi-customer-service:latest
    depends_on:
      config-service:
        condition: service_healthy
      registry-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:8761/eureka/
    restart: unless-stopped

  product-service:
    image: ghcr.io/kalebgit/storeapi-product-service:latest
    depends_on:
      config-service:
        condition: service_healthy
      registry-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:8761/eureka/
    restart: unless-stopped

  category-service:
    image: ghcr.io/kalebgit/storeapi-category-service:latest
    depends_on:
      config-service:
        condition: service_healthy
      registry-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/category_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:8761/eureka/
    restart: unless-stopped

  invoice-service:
    image: ghcr.io/kalebgit/storeapi-invoice-service:latest
    depends_on:
      config-service:
        condition: service_healthy
      registry-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/invoice_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:8761/eureka/
    restart: unless-stopped

  gateway-service:
    image: ghcr.io/kalebgit/storeapi-gateway-service:latest
    ports:
      - "8080:8080"
    depends_on:
      config-service:
        condition: service_healthy
      registry-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:8761/eureka/
    restart: unless-stopped

  admin-service:
    image: ghcr.io/kalebgit/storeapi-admin-service:latest
    ports:
      - "127.0.0.1:9090:9090"   # solo accesible desde el propio VPS, no al exterior
    depends_on:
      config-service:
        condition: service_healthy
      registry-service:
        condition: service_healthy
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:8761/eureka/
    restart: unless-stopped

volumes:
  postgres_data:
