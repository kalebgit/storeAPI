server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webmvc:
          trusted-proxies: "10\\.0\\.0\\..*"
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "http://localhost:3000"
                allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
                allowed-headers: "Authorization,Content-Type"
                allow-credentials: true
                max-age: 3600
          routes:
            - id: api-docs-auth
              uri: lb://auth-service
              predicates:
                - Path=/v3/api-docs/auth-service
              filters:
                - RewritePath=/v3/api-docs/auth-service, /v3/api-docs

            - id: api-docs-customer
              uri: lb://customer-service
              predicates:
                - Path=/v3/api-docs/customer-service
              filters:
                - RewritePath=/v3/api-docs/customer-service, /v3/api-docs

            - id: api-docs-product
              uri: lb://product-service
              predicates:
                - Path=/v3/api-docs/product-service
              filters:
                - RewritePath=/v3/api-docs/product-service, /v3/api-docs

            - id: api-docs-category
              uri: lb://category-service
              predicates:
                - Path=/v3/api-docs/category-service
              filters:
                - RewritePath=/v3/api-docs/category-service, /v3/api-docs

            - id: api-docs-invoice
              uri: lb://invoice-service
              predicates:
                - Path=/v3/api-docs/invoice-service
              filters:
                - RewritePath=/v3/api-docs/invoice-service, /v3/api-docs

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/customer/**
              filters:
                - StripPrefix=0

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/product/**
              filters:
                - StripPrefix=0

            - id: category-service
              uri: lb://category-service
              predicates:
                - Path=/category/**
              filters:
                - StripPrefix=0

            - id: invoice-service
              uri: lb://invoice-service
              predicates:
                - Path=/invoice/**
              filters:
                - StripPrefix=0

            - id: cart-service
              uri: lb://invoice-service
              predicates:
                - Path=/cart-item/**
              filters:
                - StripPrefix=0

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,env
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    urls:
      - name: auth-service
        url: /v3/api-docs/auth-service
      - name: customer-service
        url: /v3/api-docs/customer-service
      - name: product-service
        url: /v3/api-docs/product-service
      - name: category-service
        url: /v3/api-docs/category-service
      - name: invoice-service
        url: /v3/api-docs/invoice-service
    path: /swagger-ui.html
    disable-swagger-default-url: true

---
spring:
  config:
    activate:
      on-profile: dev
eureka:
  client:
    service-url:
      defaultZone: http://registry-service:8761/eureka

---
spring:
  config:
    activate:
      on-profile: prod
eureka:
  client:
    service-url:
      defaultZone: http://registry-service:8761/eureka
