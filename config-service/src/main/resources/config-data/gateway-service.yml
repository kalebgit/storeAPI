server:
  port: 8080

spring:

  #para la parte de jwt y las claves privadas y publicas
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service/.well-known/jwks.json

  cloud:
    gateway:
      server:
        webmvc:
          # confiar en headers de proxy (Nginx, load balancer)
          # TODO: implementar o documentar por que puse esto en el proyecto
          trusted-proxies: "10\\.0\\.0\\..*"
          # configuracion de cors centralizado para no ponerlo en cada sericio
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "http://localhost:3000"
                allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
                allowed-headers: "Authorization,Content-Type"
                allow-credentials: true
                max-age: 3600
      routes:
        # rutas hacia servicios de negocio — usa el nombre de Eureka
        - id: auth-service
          uri: lb://auth-service          # lb:// = load balanced
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=0               # no quita el prefijo

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
          filters:
            - StripPrefix=1               # quita /api → /products/...

        - id: category-service
          uri: lb://category-service
          predicates:
            - Path=/api/categories/**
          filters:
            - StripPrefix=1

      # descubrimiento automático con Eureka por si se me fue alguna
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true     # product-service en lugar de PRODUCT-SERVICE
          #porque normalmente en eureka estan los nombres en mayus

eureka:     # necesario para que lb:// funcione
  client:
    register-with-eureka: true #el gateway tambien se registra en eureka
    fetch-registry: true #descarga el registro para conocer los otros serv
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
