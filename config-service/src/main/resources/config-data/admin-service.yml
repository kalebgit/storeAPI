spring:
  application:
    name: admin-server
  boot:
    admin:
      discovery:
        enabled: true    # para que lo descubra eureka

server:
  port: 9090

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true    # tambien se registra en eureka
    fetch-registry: true          # descubrir otros servicios
  instance:
    prefer-ip-address: true